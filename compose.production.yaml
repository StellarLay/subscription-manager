name: subsio-production

x-node-app: &node-app
  image: subsio-node:latest
  build:
    context: .
    dockerfile: docker/node.prod.Dockerfile
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  server:
    <<: *node-app
    command: >-
      sh -c "pnpm --filter @subscription-manager/server run db:deploy &&
      pnpm --filter @subscription-manager/server run start"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      API_HOST: 0.0.0.0
      API_PORT: 3000
      WEB_ORIGIN: https://${APP_HOST}
      SESSION_COOKIE_SECURE: 'true'
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      TELEGRAM_AUTH_DEV_BYPASS: 'false'
      TELEGRAM_AUTH_MAX_AGE_SECONDS: ${TELEGRAM_AUTH_MAX_AGE_SECONDS:-600}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  bot:
    <<: *node-app
    command: pnpm --filter @subscription-manager/bot run start
    network_mode: host
    environment:
      NODE_ENV: production
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-SubsioAppBot}
      TELEGRAM_MINI_APP_URL: https://${APP_HOST}
    depends_on:
      server:
        condition: service_healthy

  web:
    image: subsio-web:latest
    build:
      context: .
      dockerfile: docker/web.prod.Dockerfile
    environment:
      APP_HOST: ${APP_HOST}
    network_mode: host
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_config:
  caddy_data:
  postgres_data:
