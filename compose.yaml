name: subscription-manager

x-dev-app: &dev-app
  image: subsio-dev:latest
  build:
    context: .
    dockerfile: docker/dev.Dockerfile

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-subscription_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-subscription_manager}
      POSTGRES_DB: ${POSTGRES_DB:-subscription_manager}
    ports:
      - '${POSTGRES_PORT:-54329}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-subscription_manager} -d ${POSTGRES_DB:-subscription_manager}
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '1025:1025'
      - '8025:8025'
    restart: unless-stopped

  server:
    <<: *dev-app
    command: >-
      sh -c "pnpm install --frozen-lockfile &&
      pnpm --filter @subscription-manager/server run dev:docker"
    environment:
      CI: 'true'
      DATABASE_URL: postgresql://${POSTGRES_USER:-subscription_manager}:${POSTGRES_PASSWORD:-subscription_manager}@postgres:5432/${POSTGRES_DB:-subscription_manager}?schema=public
      API_HOST: 0.0.0.0
      API_PORT: 3000
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      TELEGRAM_AUTH_DEV_BYPASS: ${TELEGRAM_AUTH_DEV_BYPASS:-true}
      TELEGRAM_AUTH_MAX_AGE_SECONDS: ${TELEGRAM_AUTH_MAX_AGE_SECONDS:-600}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.timeweb.ai/v1}
      ASSISTANT_DISABLE_DAILY_LIMIT: ${ASSISTANT_DISABLE_DAILY_LIMIT:-false}
      ASSISTANT_BOT_TOKEN: ${ASSISTANT_BOT_TOKEN:-}
      WEB_ORIGIN: http://localhost:5173
    ports:
      - '${API_EXPOSE_PORT:-3002}:3000'
    volumes:
      - .:/workspace
      - server_node_modules:/workspace/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  web:
    <<: *dev-app
    command: >-
      sh -c "pnpm install --frozen-lockfile &&
      pnpm --filter @subscription-manager/web run dev"
    environment:
      CI: 'true'
      VITE_DEV_PROXY_TARGET: http://server:3000
    ports:
      - '5173:5173'
    volumes:
      - .:/workspace
      - web_node_modules:/workspace/node_modules
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:5173/ >/dev/null || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  bot:
    <<: *dev-app
    profiles: [bot]
    command: >-
      sh -c "pnpm install --frozen-lockfile &&
      pnpm --filter @subscription-manager/bot run dev"
    environment:
      CI: 'true'
      DATABASE_URL: postgresql://${POSTGRES_USER:-subscription_manager}:${POSTGRES_PASSWORD:-subscription_manager}@postgres:5432/${POSTGRES_DB:-subscription_manager}?schema=public
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-SubsioAppBot}
      TELEGRAM_MINI_APP_URL: ${TELEGRAM_MINI_APP_URL:-}
      ASSISTANT_API_URL: http://server:3000/api/assistant
      ASSISTANT_BOT_TOKEN: ${ASSISTANT_BOT_TOKEN:-}
    volumes:
      - .:/workspace
      - bot_node_modules:/workspace/node_modules
    depends_on:
      server:
        condition: service_healthy
    restart: on-failure

  worker:
    <<: *dev-app
    profiles: [notifications]
    command: >-
      sh -c "pnpm install --frozen-lockfile &&
      pnpm --filter @subscription-manager/domain run build &&
      pnpm --filter @subscription-manager/server run db:generate &&
      pnpm --filter @subscription-manager/server run build &&
      pnpm --filter @subscription-manager/server run start:worker"
    environment:
      CI: 'true'
      DATABASE_URL: postgresql://${POSTGRES_USER:-subscription_manager}:${POSTGRES_PASSWORD:-subscription_manager}@postgres:5432/${POSTGRES_DB:-subscription_manager}?schema=public
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_MINI_APP_URL: ${TELEGRAM_MINI_APP_URL:-}
    volumes:
      - .:/workspace
      - worker_node_modules:/workspace/node_modules
    depends_on:
      server:
        condition: service_healthy
    restart: on-failure

volumes:
  bot_node_modules:
  postgres_data:
  server_node_modules:
  web_node_modules:
  worker_node_modules:
